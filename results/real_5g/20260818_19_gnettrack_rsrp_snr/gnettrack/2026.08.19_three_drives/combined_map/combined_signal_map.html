  <style>
    :root { color-scheme: dark; --panel:#111827ee; --muted:#9ca3af; --line:#374151; }

    h1 { font-size:17px; margin:0 0 5px; } p { margin:5px 0; } .muted { color:var(--muted); }

    button.active { background:#0369a1; border-color:#38bdf8; }
    .warning { background:#451a03; border:1px solid #f59e0b; color:#fde68a; border-radius:7px; padding:8px; }
    .legend { margin-top:10px; } .gradient { height:12px; border-radius:6px;

    .ticks { display:flex; justify-content:space-between; color:#d1d5db; font-size:12px; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:10px; }
    .stat { background:#1f2937; border-radius:6px; padding:6px; text-align:center; }
    .stat b { display:block; font-size:15px; }.stat span { font-size:11px;color:var(--muted); }
    .leaflet-popup-content-wrapper,.leaflet-popup-tip { background:#111827;color:#f9fafb; }
    .leaflet-popup-content { line-height:1.55; }
    @media (max-height:650px) { .panel { max-height:calc(100vh - 28px); overflow:auto; } }
  </style>
</head>
